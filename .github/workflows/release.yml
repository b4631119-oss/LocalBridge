name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-arm64, osx-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LocalBridge.slnx

      - name: Publish
        run: dotnet publish LocalBridge.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.rid }}

      - name: Rename binary
        run: |
          RID="${{ matrix.rid }}"
          PUB_DIR="publish/$RID"
          case $RID in
            linux-x64)   NAME="LocalBridge-linux-x64" ;;
            linux-arm64) NAME="LocalBridge-linux-arm64" ;;
            win-x64)     NAME="LocalBridge-win-x64.exe" ;;
            win-arm64)   NAME="LocalBridge-win-arm64.exe" ;;
            osx-arm64)   NAME="LocalBridge-osx-arm64" ;;
            osx-x64)     NAME="LocalBridge-osx-x64" ;;
          esac
          if [ -f "$PUB_DIR/LocalBridge.Desktop" ]; then
            mv "$PUB_DIR/LocalBridge.Desktop" "$PUB_DIR/$NAME"
          elif [ -f "$PUB_DIR/LocalBridge.Desktop.exe" ]; then
            mv "$PUB_DIR/LocalBridge.Desktop.exe" "$PUB_DIR/$NAME"
          fi
          # Also rename companion files
          for f in "$PUB_DIR"/LocalBridge.Desktop.*; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              mv "$f" "$PUB_DIR/$NAME.$ext"
            fi
          done

      - name: Verify binary exists
        run: |
          RID="${{ matrix.rid }}"
          PUB_DIR="publish/$RID"
          case $RID in
            linux-x64)   NAME="LocalBridge-linux-x64" ;;
            linux-arm64) NAME="LocalBridge-linux-arm64" ;;
            win-x64)     NAME="LocalBridge-win-x64.exe" ;;
            win-arm64)   NAME="LocalBridge-win-arm64.exe" ;;
            osx-arm64)   NAME="LocalBridge-osx-arm64" ;;
            osx-x64)     NAME="LocalBridge-osx-x64" ;;
          esac
          test -f "$PUB_DIR/$NAME" && echo "Found: $PUB_DIR/$NAME" || { echo "Missing: $PUB_DIR/$NAME"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/LocalBridge-*

